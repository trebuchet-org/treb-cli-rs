name: Foundry Nightly Watch

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-update:
    name: Check for foundry nightly update
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      tag: ${{ steps.check.outputs.tag }}
      foundry_tag: ${{ steps.check.outputs.foundry_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for new foundry nightly
        id: check
        run: |
          # Get the commit hash the foundry nightly tag points to
          LATEST_HASH=$(curl -fsSL https://api.github.com/repos/foundry-rs/foundry/git/ref/tags/nightly \
            | jq -r '.object.sha // empty')

          if [ -z "$LATEST_HASH" ]; then
            echo "No foundry nightly tag found"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find current foundry tag in Cargo.toml
          CURRENT_TAG=$(grep -oP 'tag\s*=\s*"nightly-\K[^"]+' Cargo.toml | head -1 || echo "")

          if [ "$CURRENT_TAG" = "$LATEST_HASH" ]; then
            echo "Already on latest foundry nightly ($CURRENT_TAG)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FOUNDRY_TAG="nightly-${LATEST_HASH}"
          FOUNDRY_SHORT="${LATEST_HASH:0:8}"
          TREB_SHORT="$(git rev-parse --short HEAD)"
          RELEASE_TAG="nightly-${TREB_SHORT}+foundry-nightly-${FOUNDRY_SHORT}"

          echo "New foundry nightly: $FOUNDRY_TAG"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "foundry_tag=${FOUNDRY_TAG}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.check.outputs.updated == 'true'

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.check.outputs.updated == 'true'

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: steps.check.outputs.updated == 'true'
        continue-on-error: true
      - name: Configure sccache
        if: steps.check.outputs.updated == 'true'
        run: |
          if command -v sccache &>/dev/null && sccache --start-server 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Update Cargo.toml foundry dep + patch revs
        if: steps.check.outputs.updated == 'true'
        run: |
          set -eo pipefail
          FOUNDRY_TAG="${{ steps.check.outputs.foundry_tag }}"
          FOUNDRY_HASH="${FOUNDRY_TAG#nightly-}"

          # Bump the foundry git-tag pin on every line that has it.
          sed -i "s|tag = \"nightly-[a-f0-9]*\"|tag = \"${FOUNDRY_TAG}\"|g" Cargo.toml

          # Mirror foundry's own [patch.crates-io] revs for the three repos
          # we also patch. Foundry's nightly bumps these alongside its own
          # source — pinning only the foundry tag leaves us with a stale
          # tempo/op/solar that no longer satisfies the new alloy/reth/etc.
          # trait surface (e.g. tempo at the previous rev missing
          # `reth_codecs::Compact` impls demanded by the bumped reth-codecs).
          FOUNDRY_CARGO=$(curl -fsSL \
            "https://raw.githubusercontent.com/foundry-rs/foundry/${FOUNDRY_HASH}/Cargo.toml")

          extract_rev() {
            # First rev= for a given git URL in foundry's Cargo.toml.
            local repo="$1"
            echo "$FOUNDRY_CARGO" \
              | grep -F "$repo" \
              | grep -oP 'rev = "\K[a-f0-9]+(?=")' \
              | head -1
          }

          NEW_OP_REV=$(extract_rev "ethereum-optimism/optimism")
          NEW_TEMPO_REV=$(extract_rev "tempoxyz/tempo")
          NEW_SOLAR_REV=$(extract_rev "paradigmxyz/solar")

          echo "Foundry's pinned revs:"
          echo "  ethereum-optimism/optimism @ ${NEW_OP_REV:-<absent>}"
          echo "  tempoxyz/tempo             @ ${NEW_TEMPO_REV:-<absent>}"
          echo "  paradigmxyz/solar          @ ${NEW_SOLAR_REV:-<absent>}"

          substitute() {
            local repo="$1" new_rev="$2"
            if [ -z "$new_rev" ]; then
              return 0
            fi
            # Match exactly `${repo}", rev = "<hex>"` to avoid stomping on
            # unrelated patch entries pointing at the same repo with different
            # commits.
            sed -i -E \
              "s|(${repo}\", rev = \")[a-f0-9]+(\")|\1${new_rev}\2|g" \
              Cargo.toml
          }

          substitute "github.com/ethereum-optimism/optimism" "$NEW_OP_REV"
          substitute "github.com/tempoxyz/tempo" "$NEW_TEMPO_REV"
          substitute "github.com/paradigmxyz/solar" "$NEW_SOLAR_REV"

      - name: Test
        if: steps.check.outputs.updated == 'true'
        run: cargo test --workspace --all-targets

      - name: Commit, tag, and push
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump foundry to ${{ steps.check.outputs.foundry_tag }}"
          # Tag triggers release-build → release pipeline
          git tag "${{ steps.check.outputs.tag }}"
          git push origin main "${{ steps.check.outputs.tag }}"

      - name: Close stale foundry-compat issues and open one on failure
        if: failure() && steps.check.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.check.outputs.foundry_tag }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Foundry nightly ${tag} breaks treb tests`;

            // Split existing open issues with the foundry-compat label:
            //   - same-tag → leave alone (one open issue per failing tag)
            //   - other-tag → stale, close them
            //
            // Earlier versions closed everything first and *then* filtered
            // the cached list for dupes; the cache still showed the just-
            // closed issue as "open", so the create step skipped forever
            // and we churned through close/recreate cycles on each run.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'foundry-compat',
              state: 'open',
            });

            const sameTag = existing.data.filter(i => i.title === title);
            const otherTag = existing.data.filter(i => i.title !== title);

            for (const issue of otherTag) {
              core.info(`Closing stale issue #${issue.number}: ${issue.title}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              });
            }

            if (sameTag.length > 0) {
              core.info(`Open issue already exists for ${tag} (#${sameTag[0].number}); skipping create`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The foundry nightly watch detected a new foundry nightly that fails treb tests.\n\nFoundry tag: \`${tag}\`\nWorkflow run: ${runUrl}`,
              labels: ['foundry-compat']
            });
