[workspace]
members = ["crates/treb-cli", "crates/treb-core", "crates/treb-config", "crates/treb-registry", "crates/treb-forge", "crates/treb-verify", "crates/treb-safe", "crates/treb-sol", "xtask"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.93"
authors = ["treb contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
treb-core = { path = "crates/treb-core" }
treb-config = { path = "crates/treb-config" }
treb-registry = { path = "crates/treb-registry" }
treb-forge = { path = "crates/treb-forge" }
treb-verify = { path = "crates/treb-verify" }
treb-safe = { path = "crates/treb-safe" }
treb-sol = { path = "crates/treb-sol" }

# === Foundry + Alloy Version Pinning Strategy ===
# Foundry: tracks nightly tags. foundry-watch.yml auto-bumps when tests pass.
# Stable builds use ci/foundry-stable-pins.toml to patch back to a stable tag.
foundry-config = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-common = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-compilers = "0.20.0"
forge-script = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
forge-script-sequence = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-evm = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-cheatcodes = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-wallets = "0.1.0"
foundry-linking = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
foundry-cli = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
forge-verify = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
anvil = { git = "https://github.com/foundry-rs/foundry", tag = "nightly-b2f2ab451ca87eba5a492941c3f22728e57227a7" }
revm-inspectors = "0.39"

# Alloy — versions aligned with foundry nightly (alloy 2.0.1)
alloy-chains = "0.2"
alloy-primitives = "1.5.2"
alloy-json-abi = "1.5"
alloy-signer = "2.0.1"
alloy-signer-ledger = "2.0.1"
alloy-signer-trezor = "2.0.1"
alloy-sol-types = "1.5.2"
alloy-provider = { version = "2.0.1", default-features = false, features = ["reqwest-rustls-tls"] }
alloy-consensus = "2.0.1"
alloy-network = "2.0.1"
alloy-rpc-types = "2.0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
nucleo-matcher = "0.3"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
owo-colors = { version = "4", features = ["supports-colors"] }
unicode-width = "0.2"

# URL parsing
url = "2"

# Environment
dotenvy = "0.15"

# File locking
fs2 = "0.4"

# Testing
num_cpus = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
similar = "2"

# Error handling & async
thiserror = "2"
anyhow = "1"
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
handlebars = "6"

# System (background anvil subprocess management)
libc = "0.2"
ureq = "3"


# Patches: mirror foundry nightly. Alloy, alloy-evm, foundry-fork-db, and
# revm-inspectors now resolve from crates.io. We still pin the op-* crates
# (alloy-op-evm 0.31 is unpublished), tempo-* (unify mpp's crates.io deps with
# foundry's git rev), and solar (0.1.9 unpublished) — matching what foundry's
# own [patch.crates-io] section does.
[patch.crates-io]
op-revm = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
op-alloy-network = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
op-alloy-rpc-types = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", rev = "e3b59e76588f99db17205f5601e45a5b00f0bfbb" }
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", rev = "6bf9903d6a75cc264029dcf54183adea38d3cfaa" }
tempo-alloy = { git = "https://github.com/tempoxyz/tempo", rev = "6bf9903d6a75cc264029dcf54183adea38d3cfaa" }
tempo-contracts = { git = "https://github.com/tempoxyz/tempo", rev = "6bf9903d6a75cc264029dcf54183adea38d3cfaa" }
solar = { package = "solar-compiler", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-interface = { package = "solar-interface", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-ast = { package = "solar-ast", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-sema = { package = "solar-sema", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
